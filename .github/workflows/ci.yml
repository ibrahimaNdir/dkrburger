name: CI Laravel

on:
  push:
    branches: [ ndir_ibrahima_burger, develop ]
  pull_request:
    branches: [ ndir_ibrahima_burger, develop ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: dkrburger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5433:5432  # Exposer le port 5432 de PostgreSQL sur le port 5433 de l'hôte
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3

      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: 📦 Installer les dépendances Composer
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: ⚙️ Copier le fichier .env
        run: cp .env.example .env

      - name: 🔑 Générer la clé de l'application
        run: php artisan key:generate

      - name: 🕒 Attendre que PostgreSQL soit prêt
        run: |
          echo "⏳ Attente de PostgreSQL..."
          for i in {1..10}; do
            nc -z postgres 5432 && echo "✅ PostgreSQL est prêt !" && break
            echo "🔁 En attente ($i/10)..."
            sleep 5
          done

      - name: 🔄 Lancer les migrations
        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1  # Utilisez 127.0.0.1 au lieu de postgres
            DB_PORT: 5433       # Le port que vous exposez
            DB_DATABASE: dkrburger
            DB_USERNAME: postgres
            DB_PASSWORD: admin
        run: php artisan migrate --force

      - name: ✅ Lancer les tests
        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1  # Utilisez 127.0.0.1 au lieu de postgres
            DB_PORT: 5433       # Le port que vous exposez
            DB_DATABASE: dkrburger
            DB_USERNAME: postgres
            DB_PASSWORD: admin
        run: php artisan test

  # Ce job ne s'exécute QUE si laravel-tests passe ✅
  docker-build:
    needs: laravel-tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3

      - name: 🐳 Build de l'image Docker
        run: docker build -t laravel-app-ci .
